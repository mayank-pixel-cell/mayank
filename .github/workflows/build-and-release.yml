name: Build and Release Arc Tracker (Desktop & Android)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact_name: Arc-Tracker-Windows
          - platform: macos-latest
            artifact_name: Arc-Tracker-macOS

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'x86_64-apple-darwin,aarch64-apple-darwin' }}

      - name: Install dependencies & Localize Assets
        run: |
          npm ci
          node scripts/localize-assets.js
          node scripts/convert-html.js
          node scripts/generate-icons.js
          npm run build

      - name: Build Desktop Native Binary (Tauri 2.0)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Arc Tracker v__VERSION__'
          releaseBody: 'Automated release of Arc Tracker standalone native applications.'
          releaseDraft: false
          prerelease: false

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install dependencies & Build Web Assets
        run: |
          npm ci
          node scripts/localize-assets.js
          node scripts/convert-html.js
          node scripts/generate-icons.js
          npm run build

      - name: Build Android APK (Tauri 2.0)
        run: |
          export NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          npx tauri android init
          npx tauri android build --apk

      - name: Sign Android Release APK
        run: |
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/release"
          UNSIGNED_APK="$APK_DIR/app-release-unsigned.apk"
          if [ -f "$UNSIGNED_APK" ]; then
            keytool -genkey -v -keystore release.keystore -alias arctracker -keyalg RSA -keysize 2048 -validity 10000 -storepass arctracker123 -keypass arctracker123 -dname "CN=ArcTracker, OU=Mobile, O=ArcTracker, L=Global, S=State, C=US"
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:arctracker123 --ks-key-alias arctracker --out "$APK_DIR/Arc-Tracker-release-signed.apk" "$UNSIGNED_APK"
            echo "Successfully signed Android release APK"
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arc-Tracker-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/release/*.apk
