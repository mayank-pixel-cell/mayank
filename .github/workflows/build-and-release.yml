name: Build and Release Arc Tracker (Desktop, Android & iOS)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact_name: Arc-Tracker-Windows
          - platform: macos-latest
            artifact_name: Arc-Tracker-macOS

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'x86_64-apple-darwin,aarch64-apple-darwin' }}

      - name: Install dependencies & Localize Assets
        run: |
          npm ci
          node scripts/localize-assets.js
          node scripts/convert-html.js
          node scripts/generate-icons.js
          npm run build

      - name: Build Desktop Native Binary (Tauri 2.0)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Arc Tracker v__VERSION__'
          releaseBody: 'Automated release of Arc Tracker standalone native applications.'
          releaseDraft: false
          prerelease: false

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

          # Automatically accept all Android SDK licenses headlessly
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

          # Install NDK 26.1.10909125, build tools 34.0.0, and Android 34 platform
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"

          # Export NDK_HOME
          NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "Selected NDK_HOME: $NDK_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Verify Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Install dependencies & Build Web Assets
        run: |
          npm ci
          node scripts/localize-assets.js
          node scripts/convert-html.js
          node scripts/generate-icons.js
          npm run build

      - name: Build Android APK (Tauri 2.0)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export NDK_HOME="${NDK_HOME:-$ANDROID_HOME/ndk/26.1.10909125}"
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"

          # 1. Initialize Android project automatically if src-tauri/gen/android is missing
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "src-tauri/gen/android is missing. Running npx tauri android init..."
            npx tauri android init --ci
          else
            echo "src-tauri/gen/android already initialized."
          fi

          # Ensure gradlew executable permissions on Linux
          if [ -f "src-tauri/gen/android/gradlew" ]; then
            chmod +x src-tauri/gen/android/gradlew
          fi

          # 2. Build Android release APK
          echo "Building Android release APK..."
          npx tauri android build --apk

      - name: Sign Android Release APK
        run: |
          KEYTOOL=$(which keytool || echo "$JAVA_HOME/bin/keytool")
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [ ! -f "$APKSIGNER" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          fi
          ZIPALIGN="$ANDROID_HOME/build-tools/34.0.0/zipalign"
          if [ ! -f "$ZIPALIGN" ]; then
            ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
          fi

          echo "Using apksigner: $APKSIGNER"
          echo "Using zipalign: $ZIPALIGN"
          echo "Using keytool: $KEYTOOL"

          KEYSTORE="release.keystore"
          ALIAS="arctracker"
          PASSWORD="arctracker123"

          if [ ! -f "$KEYSTORE" ]; then
            echo "Generating release keystore..."
            "$KEYTOOL" -genkey -v -keystore "$KEYSTORE" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASSWORD" -keypass "$PASSWORD" \
              -dname "CN=ArcTracker, OU=Mobile, O=ArcTracker, L=Global, S=State, C=US"
          fi

          TARGET_DIR="src-tauri/gen/android/app/build/outputs/apk/release"
          mkdir -p "$TARGET_DIR"

          # Find all APKs generated by Gradle
          FOUND_APKS=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" ! -name "*signed*")
          echo "Found APK files to sign:"
          echo "$FOUND_APKS"

          for apk in $FOUND_APKS; do
            echo "Processing APK: $apk"
            if [ -n "$ZIPALIGN" ] && [ -f "$ZIPALIGN" ]; then
              if ! "$ZIPALIGN" -c 4 "$apk" >/dev/null 2>&1; then
                echo "Aligning $apk..."
                "$ZIPALIGN" -f -p 4 "$apk" "$apk.aligned"
                mv "$apk.aligned" "$apk"
              fi
            fi

            BASENAME=$(basename "$apk")
            if [[ "$BASENAME" == *"unsigned"* ]]; then
              OUT_NAME=$(echo "$BASENAME" | sed 's/-unsigned//g' | sed 's/app/Arc-Tracker/g')
            else
              OUT_NAME="Arc-Tracker-$BASENAME"
            fi
            SIGNED_OUT="$TARGET_DIR/${OUT_NAME%.apk}-signed.apk"

            echo "Signing $apk -> $SIGNED_OUT ..."
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass "pass:$PASSWORD" --ks-key-alias "$ALIAS" --out "$SIGNED_OUT" "$apk"
            "$APKSIGNER" verify "$SIGNED_OUT" && echo "Verified $SIGNED_OUT successfully"
          done

          # Ensure a canonical Arc-Tracker-release-signed.apk exists
          MAIN_SIGNED="$TARGET_DIR/Arc-Tracker-release-signed.apk"
          if [ ! -f "$MAIN_SIGNED" ]; then
            FIRST_SIGNED=$(find "$TARGET_DIR" -type f -name "*-signed.apk" | head -n 1)
            if [ -n "$FIRST_SIGNED" ]; then
              cp "$FIRST_SIGNED" "$MAIN_SIGNED"
            fi
          fi

          echo "Final signed APKs in $TARGET_DIR:"
          ls -la "$TARGET_DIR"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arc-Tracker-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/release/*-signed.apk
          if-no-files-found: warn

      - name: Determine Release Tag
        id: release_tag
        run: |
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "1.0.0")
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected tag: v$VERSION"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/release/*-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable & iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Verify Rust iOS targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Install dependencies & Build Web Assets
        run: |
          npm ci
          node scripts/localize-assets.js
          node scripts/convert-html.js
          node scripts/generate-icons.js
          npm run build

      - name: Initialize & Build iOS Project (Tauri 2.0)
        run: |
          # 1. Initialize iOS project automatically if src-tauri/gen/apple is missing
          if [ ! -d "src-tauri/gen/apple" ]; then
            echo "src-tauri/gen/apple is missing. Running npx tauri ios init..."
            npx tauri ios init --ci
          else
            echo "src-tauri/gen/apple already initialized."
          fi

          # 2. Build iOS Simulator / Device project
          echo "Building iOS binary and Xcode workspace..."
          # Build simulator debug bundle headlessly without requiring paid Apple Developer Signing Team ID
          npx tauri ios build --target aarch64-apple-ios-sim --debug || npx tauri ios build --debug || true

      - name: Package iOS Xcode Workspace & App
        run: |
          mkdir -p output/ios
          # Archive the Xcode project so users can open and deploy it directly in Xcode or on their iPhone
          if [ -d "src-tauri/gen/apple" ]; then
            tar -czf output/ios/Arc-Tracker-iOS-XcodeProject.tar.gz -C src-tauri/gen apple
          fi
          # Copy any built .app or .ipa bundles if present
          find src-tauri/target -name "*.app" -exec cp -r {} output/ios/ \; 2>/dev/null || true
          find src-tauri/target -name "*.ipa" -exec cp {} output/ios/ \; 2>/dev/null || true
          ls -la output/ios

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Arc-Tracker-iOS
          path: output/ios/*
          if-no-files-found: warn

      - name: Determine Release Tag
        id: release_tag
        run: |
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "1.0.0")
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Upload iOS Project to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            output/ios/Arc-Tracker-iOS-XcodeProject.tar.gz
            output/ios/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

