[package]
name = "arc-tracker"
version = "1.0.0"
description = "Arc Tracker - Interactive Habit & Goal Tracking Application"
authors = ["Arc Tracker Team"]
edition = "2021"

[lib]
name = "arc_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
