<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="text-scale" content="scale">
    <meta name="theme-color" content="#060913" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="color-scheme" content="dark light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Arc Tracker">
    <title>Winter &amp; Summer Arc Interactive Mobile Tracker 2026</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Arc Tracker">
    <meta name="format-detection" content="telephone=no">
    <link rel="apple-touch-icon" href="./icons/128x128@2x.png">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https://lh3.googleusercontent.com https://*.googleusercontent.com https://avatars.githubusercontent.com; connect-src 'self' ipc: http://ipc.localhost https://*.arctracker.app https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https://identitytoolkit.googleapis.com https://content.googleapis.com https://*.supabase.co wss://*.supabase.co https://api.github.com https://raw.githubusercontent.com https://github.com; frame-src 'self' https://accounts.google.com; media-src 'self' data:; object-src 'none'; form-action 'none'; base-uri 'self';">
    <meta name="referrer" content="no-referrer">

    <!-- Offline QR Code Generator & Local Fonts/Icons -->
    <script src="./assets/qrcode.min.js"></script>
    <link rel="stylesheet" href="./assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="./assets/fonts/inter.css">

    
    <script>
        (function() {
            try {
                var scale = localStorage.getItem('arc_ui_font_scale');
                if (scale && scale !== '100') {
                    document.documentElement.style.fontSize = scale + '%';
                }
            } catch(e) {}
        })();
    </script>
    <!-- Early anti-FOUC check for Black & White Mode -->
    <script>
        (function() {
            try {
                if (localStorage.getItem('arc_black_white_mode') === 'true') {
                    document.documentElement.classList.add('arc-bw-mode');
                }
            } catch (e) {}
        })();
    </script>

    <!-- Google Identity Services for Optional Cross-Device Account Syncing -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="min-h-[100dvh] flex flex-col justify-between selection:bg-cyan-500 selection:text-black pb-[calc(5rem+env(safe-area-inset-bottom))] sm:pb-[calc(1.5rem+env(safe-area-inset-bottom))]">
    <div id="app-shell" class="contents"></div>

    <!-- Primary Modular Entry Point -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
